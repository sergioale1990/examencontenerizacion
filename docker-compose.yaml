name: tareas

services:

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Definir MYSQL_ROOT_PASSWORD en archivo .env}
      MYSQL_DATABASE: ${DB_NAME:-tareas}
      MYSQL_USER: ${DB_USER:-tareas}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD en archivo .env}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s


  api:
    build: .
    image: contenerizacion:1.0.3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD en archivo .env}
      SERVER_PORT: ${SERVER_PORT}
      APP_ENV: compose
      APP_VERSION: 1.0.3
    ports:
      - "8080:8080"
    networks:
      - backend
      - frontend

networks:
  backend:
    internal: true
  frontend: {}

volumes:
  mysql-data:

