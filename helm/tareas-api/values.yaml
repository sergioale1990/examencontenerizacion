replicaCount: 2

image:
  repository: contenerizacion
  tag: ""
  pullPolicy: IfNotPresent

config:
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_NAME: tareas
  DB_USER: tareas
  APP_ENV: helm

existingSecret: tareas-secret

service:
  type: NodePort
  port: 80
  nodePort: 30081

resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    memory: 768Mi